group 'vn.hunghd.flutter.plugins.imagecropper'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
		maven { url = uri('https://jitpack.io') }
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'vn.hunghd.flutter.plugins.imagecropper'
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 16
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            consumerProguardFiles 'consumer-proguard-rules.pro'
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    dependencies {
        // Kept as a local project rather than upstream's published
        // com.github.Yalantis:ucrop artifact: this app relies on the uCrop
        // fork (locked aspect ratio tab, hidden scale tab, setHideAspectRatioTab).
        implementation project(':ucrop')
        implementation 'androidx.preference:preference:1.2.1'
    }
}
